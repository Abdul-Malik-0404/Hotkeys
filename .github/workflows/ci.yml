name: Cross-Platform Build & Test Matrix

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  check-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: hotkeys-linux-x86_64
            binary_path: target/release/hotkeys
          - os: windows-latest
            artifact_name: hotkeys-windows-x86_64.exe
            binary_path: target/release/hotkeys.exe
          - os: macos-latest
            artifact_name: hotkeys-macos-arm64
            binary_path: target/release/hotkeys

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Wayland/X11 system headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run unit & keymap verification tests
        run: cargo test --verbose

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
