name: Release (Windows & macOS)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-tag:
    name: Verify Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify version against Cargo.toml
        id: version
        shell: bash
        run: |
          CARGO_VER=$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VER" != "$CARGO_VER" ]; then
              echo "::error::Tag version ($TAG_VER) does not match Cargo.toml version ($CARGO_VER)"
              exit 1
            fi
          fi
          echo "version=$CARGO_VER" >> "$GITHUB_OUTPUT"

  package-windows:
    name: Package Windows (x86_64)
    needs: verify-tag
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked --target x86_64-pc-windows-msvc --verbose

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --verbose

      - name: Package Windows archive & checksum
        shell: pwsh
        run: |
          $version = "${{ needs.verify-tag.outputs.version }}"
          $pkgName = "hotkeys-v$version-windows-x86_64"
          $stageDir = "dist/$pkgName"
          $zipName = "$pkgName.zip"
          $zipPath = "dist/$zipName"

          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/hotkeys.exe" "$stageDir/hotkeys.exe"
          Copy-Item "README.md" "$stageDir/README.md"

          Compress-Archive -Path "$stageDir/*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$zipPath.sha256", "$hash  $zipName`n")

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 7

  package-macos:
    name: Package macOS (Universal)
    needs: verify-tag
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked --verbose

      - name: Build Apple Silicon & Intel release binaries
        run: |
          cargo build --locked --release --target aarch64-apple-darwin --verbose
          cargo build --locked --release --target x86_64-apple-darwin --verbose

      - name: Create Universal .app bundle, zip, dmg & checksums
        shell: bash
        run: |
          VERSION="${{ needs.verify-tag.outputs.version }}"
          APP_DIR="dist/Hotkeys.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"

          lipo -create \
            target/aarch64-apple-darwin/release/hotkeys \
            target/x86_64-apple-darwin/release/hotkeys \
            -output "$APP_DIR/Contents/MacOS/hotkeys"
          chmod +x "$APP_DIR/Contents/MacOS/hotkeys"

          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Hotkeys</string>
            <key>CFBundleDisplayName</key>
            <string>Hotkeys</string>
            <key>CFBundleIdentifier</key>
            <string>com.hotkeys.app</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>hotkeys</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          ZIP_NAME="hotkeys-v${VERSION}-macos-universal.zip"
          DMG_NAME="hotkeys-v${VERSION}-macos-universal.dmg"

          ditto -c -k --keepParent "$APP_DIR" "dist/$ZIP_NAME"

          mkdir -p dist/dmg-root
          cp -R "$APP_DIR" dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "Hotkeys" -srcfolder dist/dmg-root -ov -format UDZO "dist/$DMG_NAME"

          (
            cd dist
            shasum -a 256 "$ZIP_NAME" > "${ZIP_NAME}.sha256"
            shasum -a 256 "$DMG_NAME" > "${DMG_NAME}.sha256"
          )

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          retention-days: 7

  publish-release:
    name: Attest & Publish GitHub Release
    needs: [verify-tag, package-windows, package-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Assemble and verify SHA256SUMS.txt
        shell: bash
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          rm -f *.sha256

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/*.dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
