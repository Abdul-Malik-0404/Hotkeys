[package]
name = "hotkeys"
version = "0.1.0"
edition = "2021"
description = "Customizable global hotkey and key-remapping GUI for Windows and macOS"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
eframe = { version = "0.29.1", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
uuid = { version = "1.24", features = ["v4", "serde"] }
